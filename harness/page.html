<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
  window.__gauntlet = { errors: [], ready: false };
  window.addEventListener('error', e => window.__gauntlet.errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', e => window.__gauntlet.errors.push(String(e.reason)));
  try {
    const mod = await import('/candidate/main.mjs');
    const app = await mod.boot(document.getElementById('c'));
    window.__app = app;
    // Position camera at flythrough t (0..1), advance sim, render one frame.
    window.__step = (t, simSteps = 2) => {
      if (app.flythrough) app.flythrough(t);
      for (let i = 0; i < simSteps; i++) app.update(1 / 60);
      app.render(16.6);
      return true;
    };
    // Measure sustained perf over `ms` of continuous rAF.
    window.__perf = (ms = 3000) => new Promise(resolve => {
      const t0 = performance.now();
      let frames = 0, worst = 0, last = t0;
      const tick = now => {
        const dt = now - last; last = now;
        if (frames > 0 && dt > worst) worst = dt;
        frames++;
        app.update(1 / 60); app.render(dt);
        if (now - t0 < ms) requestAnimationFrame(tick);
        else {
          const info = app.renderer && app.renderer.info ? app.renderer.info.render : {};
          resolve({
            avgFps: +(frames / ((now - t0) / 1000)).toFixed(1),
            worstFrameMs: +worst.toFixed(1),
            drawCalls: info.calls ?? null,
            triangles: info.triangles ?? null,
          });
        }
      };
      requestAnimationFrame(tick);
    });
    window.__gauntlet.ready = true;
  } catch (err) {
    window.__gauntlet.errors.push('boot: ' + (err && err.stack || err));
    window.__gauntlet.ready = 'failed';
  }
</script>
</body>
</html>
