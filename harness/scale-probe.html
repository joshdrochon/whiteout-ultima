{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script></head><body><pre id="o">…</pre><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// Measure both characters IN THREE, because three is what the game loads.
// Blender reads the rigged file through its armature scale and reports a
// different height, so the two are not comparable there.
const L=[],say=s=>{L.push(s);document.getElementById('o').textContent=L.join('\n');console.log(s);};
const load=u=>new Promise((res,rej)=>new GLTFLoader().load(u,res,undefined,rej));
function dims(root){
  const pts=[];
  root.updateMatrixWorld(true);
  root.traverse(o=>{
    if(!o.isMesh) return;
    const g=o.geometry, p=g.attributes.position;
    // For a SkinnedMesh the bind-pose geometry is what we want here: we are
    // comparing MODEL SCALE, not the posed silhouette.
    for(let i=0;i<p.count;i+=7){
      const v=new THREE.Vector3().fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
      pts.push(v);
    }
  });
  const ys=pts.map(v=>v.y), lo=Math.min(...ys), hi=Math.max(...ys), H=hi-lo;
  const band=(a,b,ax)=>{const s=pts.filter(v=>v.y>=lo+a*H&&v.y<=lo+b*H).map(v=>v[ax]);
    return s.length?Math.max(...s)-Math.min(...s):0;};
  return {H, headX:band(0.92,1,'x'), headZ:band(0.92,1,'z'),
          shoulderX:band(0.70,0.85,'x'), n:pts.length};
}
const A=await load('/assets/characters/nyx_rigged.glb');
const B=await load('/assets/characters/nyx_carve.glb');
const C=await load('/assets/characters/nyx_tuck.glb');
const D=await load('/assets/characters/nyx_grab.glb');
const d=dims(D.scene);
say(`grab     height ${d.H.toFixed(4)}  headDiag ${Math.hypot(d.headX,d.headZ).toFixed(4)}`);
const a=dims(A.scene), b=dims(B.scene), c=dims(C.scene);
const hd=d=>Math.hypot(d.headX,d.headZ);
say(`tuck     height ${c.H.toFixed(4)}  headX ${c.headX.toFixed(4)} headZ ${c.headZ.toFixed(4)} headDiag ${hd(c).toFixed(4)}`);
say(`=> TUCK scale to match heads: ${(hd(a)/hd(c)).toFixed(4)}`);
say(`=> GRAB scale to match heads: ${(hd(a)/hd(d)).toFixed(4)}`);
say(`neutral  height ${a.H.toFixed(4)}  headX ${a.headX.toFixed(4)} headZ ${a.headZ.toFixed(4)} headDiag ${hd(a).toFixed(4)}  shoulderX ${a.shoulderX.toFixed(4)}`);
say(`carve    height ${b.H.toFixed(4)}  headX ${b.headX.toFixed(4)} headZ ${b.headZ.toFixed(4)} headDiag ${hd(b).toFixed(4)}  shoulderX ${b.shoulderX.toFixed(4)}`);
say('');
say(`head ratio      neutral/carve = ${(hd(a)/hd(b)).toFixed(4)}`);
say(`shoulder ratio  neutral/carve = ${(a.shoulderX/b.shoulderX).toFixed(4)}`);
say(`height ratio    neutral/carve = ${(a.H/b.H).toFixed(4)}`);
say(`=> carve scale to match heads:     ${(hd(a)/hd(b)).toFixed(4)}`);
say(`=> carve scale to match shoulders: ${(a.shoulderX/b.shoulderX).toFixed(4)}`);

// ---- SURFACE AREA, the pose-invariant measure -----------------------------
// The head-band method above is unreliable for deeply bent poses: the band is
// the top 8% of the figure's HEIGHT, and on a rider folded over the grab it
// catches her back and hips rather than her head. It reported 0.6106 for the
// grab, i.e. 1.10 m tall, which is nonsense.
//
// A body's SKIN AREA does not change when it moves. Summing triangle areas is
// therefore pose-invariant, and the scale that matches two sculpts is
// sqrt(areaNeutral / areaPose). Caveats worth stating: decimation perturbs area
// slightly, and hair and clothing differ a little between sculpts, so this is
// good to a few percent and not exact.
function surfaceArea(root) {
  let A = 0;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry, pos = g.attributes.position, idx = g.index;
    const n = idx ? idx.count : pos.count;
    for (let i = 0; i < n; i += 3) {
      const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i+1) : i+1, i2 = idx ? idx.getX(i+2) : i+2;
      a.fromBufferAttribute(pos, i0).applyMatrix4(o.matrixWorld);
      b.fromBufferAttribute(pos, i1).applyMatrix4(o.matrixWorld);
      c.fromBufferAttribute(pos, i2).applyMatrix4(o.matrixWorld);
      ab.subVectors(b, a); ac.subVectors(c, a);
      A += cr.crossVectors(ab, ac).length() * 0.5;
    }
  });
  return A;
}
const areaN = surfaceArea(A.scene);
say('');
say('--- surface-area match (pose invariant) ---');
for (const [name, obj] of [['carve', B.scene], ['tuck', C.scene], ['grab', D.scene]]) {
  const ar = surfaceArea(obj);
  say(`${name.padEnd(6)} area ${ar.toFixed(3)} m2 vs neutral ${areaN.toFixed(3)}  ->  scale ${Math.sqrt(areaN / ar).toFixed(4)}`);
}
say('DONE');
</script></body></html>
