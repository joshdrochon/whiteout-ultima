<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script></head><body><pre id="o">…</pre><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// Measure both characters IN THREE, because three is what the game loads.
// Blender reads the rigged file through its armature scale and reports a
// different height, so the two are not comparable there.
const L=[],say=s=>{L.push(s);document.getElementById('o').textContent=L.join('\n');console.log(s);};
const load=u=>new Promise((res,rej)=>new GLTFLoader().load(u,res,undefined,rej));
function dims(root){
  const pts=[];
  root.updateMatrixWorld(true);
  root.traverse(o=>{
    if(!o.isMesh) return;
    const g=o.geometry, p=g.attributes.position;
    // For a SkinnedMesh the bind-pose geometry is what we want here: we are
    // comparing MODEL SCALE, not the posed silhouette.
    for(let i=0;i<p.count;i+=7){
      const v=new THREE.Vector3().fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
      pts.push(v);
    }
  });
  const ys=pts.map(v=>v.y), lo=Math.min(...ys), hi=Math.max(...ys), H=hi-lo;
  const band=(a,b,ax)=>{const s=pts.filter(v=>v.y>=lo+a*H&&v.y<=lo+b*H).map(v=>v[ax]);
    return s.length?Math.max(...s)-Math.min(...s):0;};
  return {H, headX:band(0.92,1,'x'), headZ:band(0.92,1,'z'),
          shoulderX:band(0.70,0.85,'x'), n:pts.length};
}
const A=await load('/assets/characters/nyx_rigged.glb');
const B=await load('/assets/characters/nyx_carve.glb');
const a=dims(A.scene), b=dims(B.scene);
const hd=d=>Math.hypot(d.headX,d.headZ);
say(`neutral  height ${a.H.toFixed(4)}  headX ${a.headX.toFixed(4)} headZ ${a.headZ.toFixed(4)} headDiag ${hd(a).toFixed(4)}  shoulderX ${a.shoulderX.toFixed(4)}`);
say(`carve    height ${b.H.toFixed(4)}  headX ${b.headX.toFixed(4)} headZ ${b.headZ.toFixed(4)} headDiag ${hd(b).toFixed(4)}  shoulderX ${b.shoulderX.toFixed(4)}`);
say('');
say(`head ratio      neutral/carve = ${(hd(a)/hd(b)).toFixed(4)}`);
say(`shoulder ratio  neutral/carve = ${(a.shoulderX/b.shoulderX).toFixed(4)}`);
say(`height ratio    neutral/carve = ${(a.H/b.H).toFixed(4)}`);
say(`=> carve scale to match heads:     ${(hd(a)/hd(b)).toFixed(4)}`);
say(`=> carve scale to match shoulders: ${(a.shoulderX/b.shoulderX).toFixed(4)}`);
say('DONE');
</script></body></html>
