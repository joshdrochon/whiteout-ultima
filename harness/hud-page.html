<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#hudroot{position:fixed;inset:0;pointer-events:none}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script>const _c=document.getElementById("c");_c.width=innerWidth;_c.height=innerHeight;</script>
<div id="hudroot"></div>
<script type="module">
  window.__gauntlet = { errors: [], ready: false };
  window.addEventListener('error', e => window.__gauntlet.errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', e => window.__gauntlet.errors.push(String(e.reason)));
  try {
    const game = await import('/game/main.mjs');
    const app = await game.boot(document.getElementById('c'));
    const { createHud } = await import('/candidate/hud.mjs');
    const hud = createHud(document.getElementById('hudroot'),
      { riderState: app.riderState, trickState: app.trickState });
    window.__app = app; window.__hud = hud;
    window.__step = (t, simSteps = 2) => {
      if (app.flythrough) app.flythrough(t);
      for (let i = 0; i < simSteps; i++) app.update(1 / 60);
      hud.update(1 / 60);
      app.render(16.6);
      return true;
    };
    window.__perf = (ms = 3000) => new Promise(resolve => {
      const t0 = performance.now(); let frames = 0, last = t0;
      const tick = now => {
        const dt = now - last; last = now; frames++;
        app.update(1 / 60); hud.update(1 / 60); app.render(dt);
        if (now - t0 < ms) requestAnimationFrame(tick);
        else resolve({ avgFps: +(frames / ((now - t0) / 1000)).toFixed(1) });
      };
      requestAnimationFrame(tick);
    });
    window.__gauntlet.ready = true;
  } catch (err) {
    window.__gauntlet.errors.push('boot: ' + (err && err.stack || err));
    window.__gauntlet.ready = 'failed';
  }
</script>
</body>
</html>
