</script><style>html,body{margin:0;height:100%;overflow:hidden;background:#0f1419}
canvas{display:block;width:100vw;height:100vh}

<body><canvas id="c"></canvas><div id="l">booting…</div>
<script type="module">
import { boot } from '/src/game/main.mjs';
// Look at the END OF THE COURSE without riding two minutes to get there. Boots
// the real rig — same terrain, same materials, same fog — then parks the camera
// past the finish line and renders one frame. The URL picks the shot.
const canvas = document.getElementById('c');
canvas.width = innerWidth; canvas.height = innerHeight;
const app = await boot(canvas);
window.__app = app;
const q = new URLSearchParams(location.search);
const pz = +(q.get('z') ?? 2300);
const hide = q.get('hide');

// PUT THE RIDER THERE AND LET THE RIG RUN. The first version of this probe
// parked a camera and rendered one frame, which was wrong: LOD streaming happens
// inside update(), so every tile was still at its initial COARSEST level (seg 4,
// 62.5 m per quad) and the "jank" it showed was the probe's own doing. Riding
// the state to the finish and stepping the rig is the only way to see what a
// player sees.
const st = app.riderState();
st.pos[2] = pz;
st.pos[0] = 0;
st.pos[1] = app.sampleHeight(0, pz) + 1.0;
st.vel[0] = 0; st.vel[1] = 0; st.vel[2] = 6;
for (let i = 0; i < 90; i++) app.update(1 / 60);   // let LOD stream in

let nInner = 0, nOuter = 0;
app.scene.traverse((o) => {
  if (!o.isMesh) return;
  if (!o.geometry?.boundingBox) o.geometry?.computeBoundingBox?.();
  const bb = o.geometry?.boundingBox; if (!bb) return;
  const w = bb.max.x - bb.min.x;
  if (w < 100) return;
  const outer = w > 600;
  outer ? nOuter++ : nInner++;
  if (hide === 'outer' && outer) o.visible = false;
  if (hide === 'inner' && !outer) o.visible = false;
});
// GLB props load async and are NOT in the scene when boot() returns — the
// first version of this readout said "instanced: NONE" while 160 dead trees
// were loading, and the render it took was of a scene without them. Wait, then
// render, then report.
await new Promise(r => setTimeout(r, 2500));
app.render(0);
// FLOAT AUDIT. Reads the real instance matrices out of the scene and checks
// each tree's base against the terrain UNDER ITS FOOTPRINT, not just under its
// centre — a trunk grounded on the centre height hangs in mid-air on its
// downhill side, and every tree band is a slope. Positive gap = floating.
const insts = [];
const THREE = await import('three');
const m4 = new THREE.Matrix4(), pv = new THREE.Vector3(),
      qv = new THREE.Quaternion(), sv = new THREE.Vector3();
app.scene.traverse((o) => {
  if (!o.isInstancedMesh) return;
  let worst = -Infinity, worstAt = null, floating = 0;
  // Each species' REAL contact radius, published by placeTrees. A blanket
  // radius reports a bare dead trunk as floating by 3 m when it is not.
  const R = o.userData.footprint ?? 1.5;
  for (let i = 0; i < o.count; i++) {
    o.getMatrixAt(i, m4);
    m4.decompose(pv, qv, sv);
    let lo = app.sampleHeight(pv.x, pv.z);
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2, r = R * sv.x;
      lo = Math.min(lo, app.sampleHeight(pv.x + Math.cos(a) * r, pv.z + Math.sin(a) * r));
    }
    const gap = pv.y - lo;             // >0 means the base is above the ground
    if (gap > 0.05) floating++;
    if (gap > worst) { worst = gap; worstAt = [Math.round(pv.x), Math.round(pv.z)]; }
  }
  insts.push(`${o.userData.label ?? 'inst'} ${o.count}  worstGap ${worst.toFixed(2)}m  floating ${floating}` +
             (floating ? ` (worst at ${worstAt})` : ''));
});
document.getElementById('l').textContent =
  `rider parked at z=${pz} (finish z=2400), rig stepped 90 frames\n` +
  `inner tiles ${nInner}  outer ${nOuter}  hide=${hide ?? 'none'}\n` +
  `instanced: ${insts.length ? insts.join(' | ') : 'NONE'}`;
console.log('ENDMAP READY');
</script></body></html>
